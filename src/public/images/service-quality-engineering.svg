<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350" role="img" aria-labelledby="qeTitle qeDesc">
  <title id="qeTitle">Quality Engineering &amp; Adversarial Verification Architecture</title>
  <desc id="qeDesc">Multi-layer deterministic test harness, API mutation testing, chaos engineering, and continuous verification gates.</desc>
  <defs>
    <linearGradient id="qeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="qeShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="600" height="350" rx="10" fill="url(#qeBg)" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Left: Test Pyramids -->
  <g filter="url(#qeShadow)">
    <rect x="30" y="65" width="120" height="220" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="30" y="65" width="120" height="4" rx="2" fill="#0052CC"/>
    <text x="90" y="90" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0A192F" text-anchor="middle">TEST PYRAMID</text>

    <rect x="40" y="110" width="100" height="45" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="90" y="130" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#334155" text-anchor="middle">Deterministic Unit</text>
    <text x="90" y="145" font-family="'Inter', sans-serif" font-size="8" fill="#059669" text-anchor="middle">100% Pass Rate</text>

    <rect x="40" y="165" width="100" height="45" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="90" y="185" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#334155" text-anchor="middle">API Contracts</text>
    <text x="90" y="200" font-family="'Inter', sans-serif" font-size="8" fill="#0052CC" text-anchor="middle">OpenAPI / Schema</text>

    <rect x="40" y="220" width="100" height="45" rx="4" fill="#ECFDF5"/>
    <text x="90" y="240" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#059669" text-anchor="middle">Isolated DB</text>
    <text x="90" y="255" font-family="'Inter', sans-serif" font-size="8" fill="#059669" text-anchor="middle">:memory: Concurrency</text>
  </g>

  <path d="M 150 185 L 190 185" stroke="#0052CC" stroke-width="2"/>

  <!-- Center: Adversarial & Chaos Harness -->
  <g filter="url(#qeShadow)">
    <rect x="190" y="55" width="220" height="240" rx="8" fill="#FFFFFF" stroke="#0052CC" stroke-width="1.5"/>
    <rect x="190" y="55" width="220" height="26" rx="8" fill="#F0F7FF"/>
    <text x="300" y="73" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0052CC" text-anchor="middle">ADVERSARIAL VERIFICATION</text>

    <rect x="205" y="95" width="190" height="50" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="300" y="117" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0A192F" text-anchor="middle">Fuzzing &amp; Mutation Testing</text>
    <text x="300" y="132" font-family="'Inter', sans-serif" font-size="8" fill="#64748B" text-anchor="middle">Automated Schema Boundary &amp; Payload Fuzzing</text>

    <rect x="205" y="155" width="190" height="60" rx="6" fill="#F0F7FF" stroke="#0284C7"/>
    <text x="300" y="177" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0284C7" text-anchor="middle">Chaos Engineering Injections</text>
    <text x="300" y="193" font-family="'Inter', sans-serif" font-size="8" fill="#64748B" text-anchor="middle">Network Latency • Kernel Faults • Pod Eviction</text>
    <text x="300" y="206" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#0052CC" text-anchor="middle">Automated Self-Healing Verified</text>

    <rect x="205" y="225" width="190" height="55" rx="6" fill="#ECFDF5"/>
    <text x="300" y="247" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#059669" text-anchor="middle">Continuous Quality Gates</text>
    <text x="300" y="262" font-family="'Inter', sans-serif" font-size="8" fill="#059669" text-anchor="middle">Zero Unverified Production Commits</text>
  </g>

  <path d="M 410 185 L 450 185" stroke="#0052CC" stroke-width="2"/>

  <!-- Right: Delivery Pipeline Assurance -->
  <g filter="url(#qeShadow)">
    <rect x="450" y="65" width="120" height="220" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="450" y="65" width="120" height="4" rx="2" fill="#059669"/>
    <text x="510" y="90" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0A192F" text-anchor="middle">CI/CD GATES</text>

    <rect x="460" y="110" width="100" height="45" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="510" y="130" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#334155" text-anchor="middle">Performance Load</text>
    <text x="510" y="145" font-family="'Inter', sans-serif" font-size="8" fill="#0052CC" text-anchor="middle">k6 / Distributed</text>

    <rect x="460" y="165" width="100" height="45" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="510" y="185" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#334155" text-anchor="middle">WCAG 2.1 AA</text>
    <text x="510" y="200" font-family="'Inter', sans-serif" font-size="8" fill="#059669" text-anchor="middle">Automated Audit</text>

    <rect x="460" y="220" width="100" height="45" rx="4" fill="#ECFDF5"/>
    <text x="510" y="240" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#059669" text-anchor="middle">100% Deterministic</text>
    <text x="510" y="255" font-family="'Inter', sans-serif" font-size="8" fill="#059669" text-anchor="middle">Zero Flakiness</text>
  </g>

  <rect x="165" y="15" width="270" height="24" rx="12" fill="#EBF3FF"/>
  <text x="300" y="31" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0052CC" text-anchor="middle">
    CONTINUOUS QUALITY &amp; ADVERSARIAL HARNESS
  </text>
</svg>
