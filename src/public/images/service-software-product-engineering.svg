<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350" role="img" aria-labelledby="softEngTitle softEngDesc">
  <title id="softEngTitle">Software Product Engineering Architecture</title>
  <desc id="softEngDesc">Domain-driven microservices, CQRS, reactive clients, and distributed type-safe API platforms.</desc>
  <defs>
    <linearGradient id="softBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="600" height="350" rx="10" fill="url(#softBg)" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Client & Edge Gateway -->
  <g filter="url(#softShadow)">
    <rect x="30" y="70" width="100" height="210" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="30" y="70" width="100" height="4" rx="2" fill="#0052CC"/>
    <text x="80" y="95" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0A192F" text-anchor="middle">EDGE CLIENT</text>

    <rect x="40" y="115" width="80" height="45" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="80" y="137" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#334155" text-anchor="middle">Reactive UI</text>
    <text x="80" y="150" font-family="'Inter', sans-serif" font-size="8" fill="#64748B" text-anchor="middle">Micro-Frontends</text>

    <rect x="40" y="175" width="80" height="45" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="80" y="197" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#334155" text-anchor="middle">API Gateway</text>
    <text x="80" y="210" font-family="'Inter', sans-serif" font-size="8" fill="#64748B" text-anchor="middle">gRPC / OpenAPI</text>

    <rect x="40" y="235" width="80" height="30" rx="4" fill="#EBF3FF"/>
    <text x="80" y="254" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#0052CC" text-anchor="middle">Zero-Trust mTLS</text>
  </g>

  <path d="M 130 195 L 180 195" stroke="#0052CC" stroke-width="2"/>

  <!-- Domain Services -->
  <g filter="url(#softShadow)">
    <rect x="180" y="60" width="220" height="230" rx="8" fill="#FFFFFF" stroke="#0052CC" stroke-width="1.5"/>
    <rect x="180" y="60" width="220" height="26" rx="8" fill="#F0F7FF"/>
    <text x="290" y="78" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0052CC" text-anchor="middle">DOMAIN-DRIVEN CORE (CQRS)</text>

    <!-- Command Side -->
    <rect x="195" y="100" width="90" height="65" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="240" y="120" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0A192F" text-anchor="middle">Command</text>
    <text x="240" y="135" font-family="'Inter', sans-serif" font-size="8" fill="#64748B" text-anchor="middle">Mutations / Invariants</text>
    <text x="240" y="152" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#0052CC" text-anchor="middle">Event Sourcing</text>

    <!-- Query Side -->
    <rect x="295" y="100" width="90" height="65" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="340" y="120" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0A192F" text-anchor="middle">Query Engine</text>
    <text x="340" y="135" font-family="'Inter', sans-serif" font-size="8" fill="#64748B" text-anchor="middle">Read Projections</text>
    <text x="340" y="152" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#059669" text-anchor="middle">&lt; 5ms Latency</text>

    <!-- Event Bus Bridge -->
    <rect x="195" y="180" width="190" height="45" rx="6" fill="#F0F7FF" stroke="#0284C7"/>
    <text x="290" y="200" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0284C7" text-anchor="middle">Distributed Event Ledger</text>
    <text x="290" y="214" font-family="'Inter', sans-serif" font-size="8" fill="#64748B" text-anchor="middle">Kafka / Transactional Outbox Pattern</text>

    <!-- State Machines -->
    <rect x="195" y="235" width="190" height="40" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="290" y="255" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#334155" text-anchor="middle">Finite State Machine Verification</text>
    <text x="290" y="267" font-family="'Inter', sans-serif" font-size="8" fill="#059669" text-anchor="middle">Zero Invalid Transitions</text>
  </g>

  <path d="M 400 135 L 450 135" stroke="#0052CC" stroke-width="2"/>
  <path d="M 400 200 L 450 200" stroke="#0052CC" stroke-width="2"/>

  <!-- Persistence & Sync -->
  <g filter="url(#softShadow)">
    <rect x="450" y="70" width="120" height="210" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="450" y="70" width="120" height="4" rx="2" fill="#0284C7"/>
    <text x="510" y="95" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#0A192F" text-anchor="middle">PERSISTENCE</text>

    <rect x="460" y="115" width="100" height="45" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="510" y="137" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#334155" text-anchor="middle">Memory Cache</text>
    <text x="510" y="150" font-family="'Inter', sans-serif" font-size="8" fill="#059669" text-anchor="middle">Redis / Sub-ms</text>

    <rect x="460" y="175" width="100" height="45" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="510" y="197" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#334155" text-anchor="middle">Primary DB</text>
    <text x="510" y="210" font-family="'Inter', sans-serif" font-size="8" fill="#64748B" text-anchor="middle">PostgreSQL / SQLite</text>

    <rect x="460" y="235" width="100" height="30" rx="4" fill="#ECFDF5"/>
    <text x="510" y="254" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#059669" text-anchor="middle">99.999% Available</text>
  </g>

  <rect x="170" y="15" width="260" height="24" rx="12" fill="#EBF3FF"/>
  <text x="300" y="31" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0052CC" text-anchor="middle">
    SOFTWARE PRODUCT ARCHITECTURE
  </text>
</svg>